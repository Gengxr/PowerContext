<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>本地知识库 · 阶跃星辰</title><link rel="stylesheet" href="/style.css"><main><small>SEEKDB × LOCAL AI</small><h1>你的资料，在本地理解。</h1><p>浏览器生成向量，seekdb 完成全文与语义混合检索。</p><section><label>知识库 <input id="kb" value="notes" pattern="[a-z0-9_]+"></label><select id="saved"><option value="">选择已有知识库</option></select><label>精度 <select id="dtype"><option value="fp16">FP16</option><option value="q8">INT8</option><option value="fp32">FP32 基线</option></select></label><label><input id="wasm" type="checkbox">强制 WASM（验证降级）</label><p id="backend">模型尚未加载</p></section><section><h2>01 导入</h2><input id="files" type="file" accept=".txt,.md" multiple><button id="import">导入文件</button><button id="sample">导入样例</button><progress id="progress" value="0" max="1"></progress><p id="status" role="status">等待操作。模型首次下载需要联网，推理不使用云端 API。</p></section><section><h2>02 混合检索</h2><form id="search"><input id="query" placeholder="例如：How can I reset my password?" required><button>检索</button></form><div id="results"></div></section><section><h2>03 可复现实验</h2><p>固定英文语料与查询，比较 FP32/WASM、INT8/WASM 单条与批量、FP16/WebGPU。自动保存原始计时、Recall@5、模型文件字节数。会下载多个模型并进行多轮真实检索。</p><button id="bench">运行实验</button><button id="export">导出日志</button><pre id="metrics"></pre></section></main><script type="module" src="/app.js"></script></html>
