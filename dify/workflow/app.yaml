      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 50
        image_file_batch_limit: 10
        image_file_size_limit: 10
        knowledge_file_size_limit: 15
        single_chunk_attachment_limit: 10
        skill_file_size_limit: 50
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: '这里是明日失物招领处。今晚，你会收到一件还没被弄丢的东西。


      先保存自己填写的档案号，再输入「开门」。初始有4枚明日币；查验一条新线索花1枚，重复查看免费。你可以「改写」一次未来：剩余币替换为2枚，旧线索保留为历史，真正的失主也可能改变。


      可输入：开门、查验1、查验2、查验3、改写、归还A、归还B、归还C、状态、帮助、封存。归还或封存即结案。相同档案号可跨对话续玩，换新档案号可重玩。


      请等每次回信结束再做下一次选择。'
