        type: answer
        variables: []
      height: 130
      id: transport_error
      position:
        x: 1360
        y: 520
      positionAbsolute:
        x: 1360
        y: 520
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
      zIndex: 0
    - data:
        code: "import json\n\ndef main(body: str, status_code: int) -> dict:\n   \
          \ generic_error = \"柜台暂时未能取得可靠回执。请稍后发送「状态」核对档案，再决定下一步。\"\n    if status_code\
          \ != 200:\n        return {\"ok\":0,\"context\":\"\",\"ledger\":\"\",\"\
          error\":generic_error}\n    try:\n        data = json.loads(body)\n    \
          \    view, ledger = data[\"view\"], data[\"ledger\"]\n        assert isinstance(view,dict)\
          \ and isinstance(ledger,str) and len(ledger) <= 12000\n        assert isinstance(view[\"\
          timeline\"],int) and isinstance(view[\"clues\"],list)\n        context =\
          \ json.dumps(view, ensure_ascii=False)\n    except (ValueError, KeyError,\
          \ TypeError, AssertionError):\n        return {\"ok\":0,\"context\":\"\"\
          ,\"ledger\":\"\",\"error\":generic_error}\n    return {\"ok\":1,\"context\"\
          :context,\"ledger\":ledger,\"error\":\"\"}\n"
        code_language: python3
        desc: ''
