    - data:
        desc: ''
        selected: false
        title: 领取档案
        type: start
        variables:
        - default: ''
          hint: 自己保存一串随机编号；相同编号可在新对话中续玩。请勿填写真实身份信息。
          label: 档案号（8～64位字母、数字、_或-）
          max_length: 64
          required: true
          type: text-input
          variable: passport
        - default: 末班车票
          label: 接收哪件失物？
          options:
          - 末班车票
          - 雨的借条
          - 空白留声片
          required: true
          type: select
          variable: case_file
      height: 133
      id: start
      position:
        x: 80
        y: 250
      positionAbsolute:
        x: 80
        y: 250
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
      zIndex: 0
    - data:
        code: "import json\nimport re\n\ndef main(passport: str, case_file: str, query:\
          \ str, run_id: str) -> dict:\n    cases = {\"末班车票\":\"ticket\", \"雨的借条\"\
          :\"umbrella\", \"空白留声片\":\"echo\"}\n    passport, query = passport.strip(),\
          \ query.strip()\n    error = \"\"\n    if not re.fullmatch(r\"[A-Za-z0-9_-]{8,64}\"\
          , passport):\n        error = \"请把档案号设为8～64位字母、数字、下划线或短横线，再发送指令。请勿填写真实身份信息。\"\
          \n    elif case_file not in cases:\n        error = \"请先从列表选择一件失物。\"\n \
          \   elif not 1 <= len(query) <= 500:\n        error = \"每次请输入1～500个字符，例如：开门、查验2、改写、归还A。\"\
          \n    elif not re.fullmatch(r\"[A-Za-z0-9_-]{8,128}\", run_id):\n      \
          \  error = \"本轮未取得有效回执编号，请重新发起对话。\"\n    body = json.dumps({\"passport\"\
          :passport,\"case_id\":cases.get(case_file,\"ticket\"),\n        \"request_id\"\
          :run_id,\"text\":query}, ensure_ascii=False)\n    return {\"valid\":0 if\
          \ error else 1,\"body\":body,\"error\":error}\n"
        code_language: python3
        desc: ''
        outputs:
          body:
            children: null
            type: string
          error:
            children: null
            type: string
          valid:
            children: null
            type: number
